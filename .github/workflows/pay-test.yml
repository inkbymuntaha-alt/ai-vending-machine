name: pay-test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "address or pay"
        default: "address"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        working-directory: scripts
        env:
          TEST_PASSPHRASE: ${{ secrets.TEST_PASSPHRASE }}
          MODE: ${{ inputs.mode }}
        run: |
          npm init -y
          npm i @x402/fetch @x402/evm viem
          node buyer.mjs
